[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loblaws-automation"
version = "1.2.0"
description = "Enterprise AR Remittance Reconciliation & Oracle Fusion AutoInvoice Engine for Grupo Bimbo (BU CACBC) and Loblaws."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Principal Solutions Architecture & Financial Engineering" }
]
dependencies = [
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "polars>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (pydantic Field)
]

[tool.ruff.lint.per-file-ignores]
"run_reconciliation.py" = ["E402"]
"verify_all_historical_batches.py" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["loblaws_automation"]
